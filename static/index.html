<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stripe Subscriptions demo</title>

    <link rel="stylesheet" href="https://unpkg.com/@appwrite.io/pink@0" />
    <link rel="stylesheet" href="https://unpkg.com/@appwrite.io/pink-icons@0" />

    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>

    <style>
      .pricing-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 1.5rem;
        margin-top: 2rem;
      }
      .pricing-card {
        border: 2px solid var(--color-border);
        border-radius: 0.5rem;
        padding: 1.5rem;
        position: relative;
        transition: border-color 0.2s;
      }
      .pricing-card:hover {
        border-color: var(--color-primary);
      }
      .pricing-card.popular {
        border-color: var(--color-primary);
        background: rgba(255, 255, 255, 0.02);
      }
      .pricing-badge {
        position: absolute;
        top: -12px;
        right: 1rem;
        background: var(--color-primary);
        color: white;
        padding: 0.25rem 0.75rem;
        border-radius: 1rem;
        font-size: 0.75rem;
        font-weight: 600;
      }
      .pricing-card h3 {
        font-size: 1.5rem;
        margin-bottom: 0.5rem;
      }
      .pricing-card .price {
        font-size: 2.5rem;
        font-weight: 700;
        margin: 1rem 0;
      }
      .pricing-card .price-period {
        font-size: 1rem;
        font-weight: 400;
        color: var(--color-neutral-400);
      }
      .pricing-card ul {
        list-style: none;
        padding: 0;
        margin: 1rem 0;
      }
      .pricing-card li {
        padding: 0.5rem 0;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .pricing-card li:before {
        content: "✓";
        color: var(--color-primary);
        font-weight: bold;
      }
      .billing-toggle {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        margin: 1.5rem 0;
      }
      .toggle-switch {
        position: relative;
        width: 60px;
        height: 30px;
        background: var(--color-border);
        border-radius: 15px;
        cursor: pointer;
        transition: background 0.3s;
      }
      .toggle-switch.active {
        background: var(--color-primary);
      }
      .toggle-slider {
        position: absolute;
        top: 3px;
        left: 3px;
        width: 24px;
        height: 24px;
        background: white;
        border-radius: 50%;
        transition: transform 0.3s;
      }
      .toggle-switch.active .toggle-slider {
        transform: translateX(30px);
      }
    </style>
  </head>
  <body class="theme-dark">
    <main class="main-content">
      <div class="top-cover u-padding-block-end-56">
        <div class="container">
          <div
            class="u-flex u-gap-16 u-flex-justify-center u-margin-block-start-16"
          >
            <h1 class="heading-level-1">Stripe Subscriptions demo</h1>
            <code class="u-un-break-text"></code>
          </div>
          <p
            class="body-text-1 u-normal u-margin-block-start-8"
            style="max-width: 50rem"
          >
            Choose your subscription plan and start managing your restaurant orders with ease.
          </p>
        </div>
      </div>
      <div x-data="{ isAnnual: false }" class="container u-margin-block-start-negative-56">
        <div class="card u-flex u-gap-24 u-flex-vertical">
          <template x-if="$store.auth.user === null">
            <p>Loading..</p>
          </template>
          <template x-if="$store.auth.user === false">
            <div>
              <p class="heading-level-4">Get Started</p>
              <p class="text u-margin-block-start-8">
                Create an account to choose your subscription plan.
              </p>

              <button
                x-on:click="$store.auth.register()"
                class="button u-margin-block-start-16"
              >
                <span class="text">Register as anonymous</span>
              </button>
            </div>
          </template>
          <template x-if="$store.auth.user">
            <div>
              <p class="heading-level-4">Subscription status</p>

              <div class="u-margin-block-start-8">
                <template x-if="$store.auth.hasSubscription()">
                  <div>
                    <div class="status is-complete">
                      <span class="status-icon"></span>
                      <span class="text" x-text="'Active: ' + $store.auth.getCurrentPlan()"></span>
                    </div>
                    <section
                      class="alert is-standalone is-info u-margin-block-start-16"
                    >
                      <div class="alert-grid">
                        <span class="icon-info" aria-hidden="true"></span>
                        <div class="alert-content">
                          <h6 class="alert-title">
                            Manage your subscription
                          </h6>
                          <p class="alert-message">
                            To cancel or change your plan, please contact support or manage via Stripe portal.
                          </p>
                        </div>
                      </div>
                    </section>
                  </div>
                </template>
                <template x-if="!$store.auth.hasSubscription()">
                  <div>
                    <div class="status is-failed">
                      <span class="status-icon"></span>
                      <span class="text">No active subscription</span>
                    </div>

                    <section
                      class="alert is-standalone is-info u-margin-block-start-16"
                    >
                      <div class="alert-grid">
                        <span class="icon-info" aria-hidden="true"></span>
                        <div class="alert-content">
                          <h6 class="alert-title">
                            Payment processing can take some time.
                          </h6>
                          <p class="alert-message">
                            If you just paid, please wait a few minutes and refresh the page.
                          </p>
                        </div>
                      </div>
                    </section>

                    <!-- Billing Toggle -->
                    <div class="billing-toggle">
                      <span :class="{ 'u-bold': !isAnnual }">Monthly</span>
                      <div
                        class="toggle-switch"
                        :class="{ 'active': isAnnual }"
                        x-on:click="isAnnual = !isAnnual"
                      >
                        <div class="toggle-slider"></div>
                      </div>
                      <span :class="{ 'u-bold': isAnnual }">Annual <span class="u-color-text-success">(Save 10%)</span></span>
                    </div>

                    <!-- Pricing Cards -->
                    <div class="pricing-grid">
                      <!-- Starter Plan -->
                      <div class="pricing-card">
                        <h3>Starter</h3>
                        <p class="u-color-text-gray">For small restaurants & cafés</p>
                        <div class="price">
                          $<span x-text="isAnnual ? '44' : '49'"></span>
                          <span class="price-period">/mo</span>
                        </div>
                        <p class="u-small u-color-text-gray" x-show="isAnnual">Billed annually ($529/year)</p>
                        <ul>
                          <li>Up to 200 orders/day</li>
                          <li>Up to 15 tables</li>
                          <li>Basic analytics</li>
                          <li>Email support</li>
                        </ul>
                        <button
                          x-on:click="subscribe('starter', isAnnual ? 'annual' : 'monthly')"
                          class="button is-secondary u-width-full-line"
                        >
                          <span class="text">Get Started</span>
                        </button>
                      </div>

                      <!-- Growth Plan -->
                      <div class="pricing-card popular">
                        <span class="pricing-badge">Most Popular</span>
                        <h3>Growth</h3>
                        <p class="u-color-text-gray">For mid-sized restaurants</p>
                        <div class="price">
                          $<span x-text="isAnnual ? '89' : '99'"></span>
                          <span class="price-period">/mo</span>
                        </div>
                        <p class="u-small u-color-text-gray" x-show="isAnnual">Billed annually ($1,069/year)</p>
                        <ul>
                          <li>Up to 1000 orders/day</li>
                          <li>Up to 50 tables</li>
                          <li>Real-time kitchen display</li>
                          <li>Advanced analytics</li>
                          <li>Email + chat support</li>
                        </ul>
                        <button
                          x-on:click="subscribe('growth', isAnnual ? 'annual' : 'monthly')"
                          class="button u-width-full-line"
                        >
                          <span class="text">Get Started</span>
                        </button>
                      </div>

                      <!-- Pro Plan -->
                      <div class="pricing-card">
                        <h3>Pro</h3>
                        <p class="u-color-text-gray">For busy restaurants & chains</p>
                        <div class="price">
                          $<span x-text="isAnnual ? '179' : '199'"></span>
                          <span class="price-period">/mo</span>
                        </div>
                        <p class="u-small u-color-text-gray" x-show="isAnnual">Billed annually ($2,149/year)</p>
                        <ul>
                          <li>Unlimited orders</li>
                          <li>Unlimited tables</li>
                          <li>Multi-location support</li>
                          <li>Custom branding</li>
                          <li>API + integrations</li>
                          <li>Priority support</li>
                        </ul>
                        <button
                          x-on:click="subscribe('pro', isAnnual ? 'annual' : 'monthly')"
                          class="button is-secondary u-width-full-line"
                        >
                          <span class="text">Get Started</span>
                        </button>
                      </div>
                    </div>
                  </div>
                </template>
              </div>

              <div class="u-flex u-gap-16 u-margin-block-start-24">
                <button
                  x-on:click="$store.auth.signOut()"
                  class="button is-secondary"
                >
                  <span class="text">Sign out</span>
                </button>
              </div>
            </div>
          </template>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/appwrite@12.0.0"></script>
    <script>
      const { Client, Account, Functions } = Appwrite;
      const client = new Client()
        .setEndpoint('{{APPWRITE_FUNCTION_API_ENDPOINT}}')
        .setProject('{{APPWRITE_FUNCTION_PROJECT_ID}}');
      const account = new Account(client);
      const functions = new Functions(client);

      async function subscribe(planType, billingInterval) {
        const execution = await functions.createExecution(
          '{{APPWRITE_FUNCTION_ID}}',
          JSON.stringify({
            planType: planType,
            billingInterval: billingInterval,
            failureUrl: window.location.href,
            successUrl: window.location.href,
          }),
          false,
          '/subscribe',
          'POST',
          {
            'Content-Type': 'application/json',
          }
        );
        const url =
          execution.responseHeaders.find(
            (header) => header.name === 'location'
          ) ?? {};
        window.location.replace(url.value ?? '/');
      }

      document.addEventListener('alpine:init', async () => {
        Alpine.store('auth', {
          user: null, // null = loading, false = not logged in, object = logged in

          async init() {
            try {
              this.user = await account.get();
            } catch (err) {
              console.warn(err);
              this.user = false;
            }
          },

          async register() {
            await account.createAnonymousSession();
            this.user = await account.get();
          },
          async signOut() {
            await account.deleteSession('current');
            this.user = false;
          },

          hasSubscription() {
            if (!this.user || !this.user.labels) return false;
            return this.user.labels.some(label =>
              label === 'planstarter' ||
              label === 'plangrowth' ||
              label === 'planpro'
            );
          },

          getCurrentPlan() {
            if (!this.user || !this.user.labels) return 'None';
            if (this.user.labels.includes('planstarter')) return 'Starter Plan';
            if (this.user.labels.includes('plangrowth')) return 'Growth Plan';
            if (this.user.labels.includes('planpro')) return 'Pro Plan';
            return 'None';
          },
        });
      });
    </script>
  </body>
</html>
